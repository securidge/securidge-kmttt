[package]
name = "kmttt-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.105"
dirs = "7.0.0"
kmttt-proto = { version = "1.3.3", path = "../kmttt-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ruzstd = "0.9.1"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
toml = "1.2.3"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
