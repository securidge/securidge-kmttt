[package]
name = "kmttt"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive", "env"] }
clap_complete = "4.6.12"
dirs = "7.0.0"
kmttt-core = { version = "1.3.5", path = "../kmttt-core" }
kmttt-detect = { version = "1.3.5", path = "../kmttt-detect" }
kmttt-ledger = { version = "1.3.5", path = "../kmttt-ledger" }
kmttt-policy = { version = "1.3.5", path = "../kmttt-policy" }
kmttt-proto = { version = "1.3.5", path = "../kmttt-proto" }
kmttt-pty = { version = "1.3.5", path = "../kmttt-pty" }
kmttt-redact = { version = "1.3.5", path = "../kmttt-redact" }
kmttt-sandbox = { version = "1.3.5", path = "../kmttt-sandbox" }
kmttt-server = { version = "1.3.5", path = "../kmttt-server" }
kmttt-tui = { version = "1.3.5", path = "../kmttt-tui" }
kmttt-web = { version = "1.3.5", path = "../kmttt-web" }
minisign-verify = "0.3.0"
sha2 = "0.11.2"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.2", features = ["platform-verifier"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
